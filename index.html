<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knovelty Platform — Proposals</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/platform.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="images/Logo-Image.jpg" alt="Knovelty logo">
        <span>
          <span class="b-name">KNOVELTY <span>Platform</span></span>
          <span class="b-tag">From knowledge to innovation</span>
        </span>
      </a>
      <div class="spacer"></div>
      <div class="acting">
        <span>Acting as</span>
        <select id="user-switch" aria-label="Switch demo user"></select>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="page-head">
      <div>
        <div class="eyebrow">Workspaces</div>
        <h1>Your proposals</h1>
        <div class="sub">Every proposal is a workspace organized around its lifecycle — pick one, or start from a call template.</div>
      </div>
      <button class="btn primary" id="new-proposal-btn">＋ New proposal</button>
    </div>

    <div class="card-grid" id="proposal-grid"></div>

    <div class="foot-note">
      <span>Knovelty Platform · Phase 1 prototype · data lives in your browser (localStorage)</span>
      <button class="btn ghost small danger" id="reset-demo">Reset demo data</button>
    </div>
  </main>

  <div id="modal-root"></div>

  <script src="js/templates.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
